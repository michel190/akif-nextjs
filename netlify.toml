[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
    # 3D : le décodeur de textures compressées KTX2 (Basis Universal, WebAssembly) tourne dans un worker
    # et utilise "new Function" en interne -> 'unsafe-eval' est NÉCESSAIRE (testé : sans lui, la 3D ne charge pas).
    # worker-src blob: = ce worker ; blob: dans img-src / connect-src = textures et modèles décodés en mémoire.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"

# Modèles 3D et transcodeur : fichiers lourds qui ne changent presque jamais →
# mis en cache 30 jours dans le navigateur (revisites quasi instantanées).
# ⚠️ Si vous remplacez un modèle, donnez-lui un NOUVEAU NOM de fichier.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/basis/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTTPS forcé (Netlify le fait déjà automatiquement sur *.netlify.app,
# cette règle est une sécurité supplémentaire explicite).
[[redirects]]
  from = "http://akif-fastfood-tg.netlify.app/*"
  to = "https://akif-fastfood-tg.netlify.app/:splat"
  status = 301
  force = true
